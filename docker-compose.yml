services:
  # 1. Servicio de Base de Datos (MongoDB)
  db:
    image: mongo:6.0
    container_name: ecommerce_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-pswrd}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-course_ecommerce_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network

  # 2. Servicio de Backend (Node.js + Express API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: always
    environment:
      PORT: ${BACKEND_INTERNAL_PORT:-3000}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-pswrd}@db:27017/${MONGO_DB_NAME:-course_ecommerce_db}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-secret_jwt_key_aws_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@course.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecommerce_network

  # 3. Servicio de Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: ecommerce_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - ecommerce_network

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  ecommerce_network:
    driver: bridge
